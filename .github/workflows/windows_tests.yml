name: Windows 測試
run-name: "${{ github.event_name }} · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number || '?', github.event.pull_request.title || github.ref_name || '(unknown ref)') || format('{0} · {1}', github.ref_name || '(unknown ref)', github.sha || '(unknown SHA)') }}"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOFLAGS: "-mod=vendor"
  CGO_ENABLED: "0"

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oobe_payload_inspection:
    name: 設定包唯讀內容驗證
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 檢查設定包三檔來源與實際雜湊
        shell: powershell
        run: |
          .\test\powershell\integration\provisioning_source_tests.ps1
      - name: 唯讀抽取並核對已審查內容
        id: payload
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path ([IO.Path]::GetTempPath()) ('windows-setup-oobe-' + [guid]::NewGuid().ToString('N'))
          "evidence=$evidence" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\script\test\verify_oobe_payload.ps1 -PackagePath .\modules\init\assets\hide_oobe.ppkg -EvidenceDirectory $evidence -BaselinePath .\modules\init\assets\payload_baseline.json
      - name: 保留內容驗證證據七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oobe-payload-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.payload.outputs.evidence }}
          retention-days: 7
          if-no-files-found: warn

      - name: 唯讀抽取開始功能表設定包並保留待審查內容
        id: start_payload
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path ([IO.Path]::GetTempPath()) ('windows-setup-start-pins-' + [guid]::NewGuid().ToString('N'))
          "evidence=$evidence" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\script\test\verify_start_pins_payload.ps1 -PackagePath .\modules\start_menu\assets\empty_start.ppkg -EvidenceDirectory $evidence -BaselinePath .\modules\start_menu\assets\payload_baseline.json
      - name: 保留開始功能表七個 XML 與未通過診斷七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: start-pins-payload-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.start_payload.outputs.evidence }}/evidence.json
            ${{ steps.start_payload.outputs.evidence }}/payload/**/*.xml
            ${{ steps.start_payload.outputs.evidence }}/payload/**/*.provxml
          retention-days: 7
          if-no-files-found: warn

  powershell-coverage:
    name: PowerShell 全源量測分片 ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得同次原始碼與完整測試清單
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 維護工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 準備固定 managed 維護編譯器
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: 準備固定的 workflow 語義檢查器
        run: |
          . .\script\docker\install_managed_tools.ps1
          $artifact = Get-ContainerWorkflowLintArtifact
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint-1.7.12'
          Install-ContainerToolArtifact -Artifact $artifact -Destination $directory -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'actionlint-download')
          "WINDOWS_SETUP_ACTIONLINT=$(Join-Path $directory 'actionlint.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: 真實執行分配的 Pester suites 並保留全部來源分母
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          . .\script\test\ci_quality_summary.ps1
          Invoke-CIShardTimed -ShardIndex ([int]$env:SHARD_INDEX) -SummaryPath $env:GITHUB_STEP_SUMMARY -Action {
            .\script\test\powershell_coverage_shard.ps1 -SourceRoot $PWD.Path -OutputDirectory (Join-Path $env:RUNNER_TEMP 'powershell-shard-public') -PrivateDirectory (Join-Path $env:RUNNER_TEMP 'powershell-shard-private') -TimingDirectory (Join-Path $env:RUNNER_TEMP 'powershell-timing-public') -ShardIndex ([int]$env:SHARD_INDEX) -ShardCount 4 -Commit $env:GITHUB_SHA -RunUrl ("https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
          }
      - name: 僅保留已驗證的相對路徑分片證據七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/powershell-shard-public/
          retention-days: 7
          if-no-files-found: error

      - name: 保留各 suite 階段時間七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-timing-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/powershell-timing-public/
          retention-days: 7
          if-no-files-found: error
  isolated-tests:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 準備固定 Go 覆蓋率工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 準備固定 managed 維護編譯器
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: 列出 runner 本機 SDK
        run: |
          dotnet --list-sdks
      - name: 準備固定的 workflow 語義檢查器
        run: |
          . .\script\docker\install_managed_tools.ps1
          $artifact = Get-ContainerWorkflowLintArtifact
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint-1.7.12'
          Install-ContainerToolArtifact -Artifact $artifact -Destination $directory -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'actionlint-download')
          "WINDOWS_SETUP_ACTIONLINT=$(Join-Path $directory 'actionlint.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: 執行 Windows PowerShell 5.1 隔離測試
        run: |
          & .\script\test\run_ci.ps1 -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results')
      - name: 顯示固定失敗測試的有限診斷
        if: failure()
        run: |
          . .\script\test\ci_tasks.ps1
          Write-CIFailureDiagnostics -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results') -SuiteNames @('Unit.uac_helpers','Integration.managed_catalog','Unit.driver_cache_cleanup','Integration.init_runtime','Integration.driver_full_source_coverage','Integration.report_bundle_publication','Integration.ci_runner_coverage')
      - name: 產生明確標示的合成首頁驗收樣本
        if: always()
        run: |
          & .\script\test\create_portal_fixture.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'requirements-fixture')
      - name: 執行全部 Go 維護工具測試
        env:
          WINDOWS_SETUP_ARTIFACT_DIR: ${{ runner.temp }}/NUC-CI-Results/public
          WINDOWS_SETUP_PORTAL_FIXTURE_DIR: ${{ runner.temp }}/requirements-fixture/portal
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('test','-mod=vendor','-count=1','./...')
      - name: 封裝尚未完成 runtime 覆蓋率的原生證據
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/repo_coverage_tool','native-stage-pack','--runtime','--source-root',$PWD.Path,'--report-dir',(Join-Path $env:RUNNER_TEMP 'NUC-CI-Results/public'),'--output-dir',(Join-Path $env:RUNNER_TEMP 'native-stage'),'--expected-sha',$env:GITHUB_SHA,'--expected-run-url',("https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"),'--run-attempt',$env:GITHUB_RUN_ATTEMPT)
      - name: 僅保留不可發布的同次原生中介證據七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage/
          retention-days: 7
          if-no-files-found: error
      - name: 保留合成驗收樣本七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: requirements-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-fixture/portal/
          retention-days: 7
          if-no-files-found: error
  coverage-aggregation:
    name: 同次完整覆蓋率聚合
    needs: [isolated-tests, powershell-coverage]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得相同量測來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 證據工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 準備本次 managed 量測編譯器
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: 下載同次與同 attempt 的原生中介證據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage-input
      - name: 先核對原位元組身分與未完成狀態才還原
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/repo_coverage_tool','native-stage-restore','--runtime','--source-root',$PWD.Path,'--input-dir',(Join-Path $env:RUNNER_TEMP 'native-stage-input'),'--output-dir',(Join-Path $env:RUNNER_TEMP 'native-stage-import'),'--expected-sha',$env:GITHUB_SHA,'--expected-run-url',("https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"),'--run-attempt',$env:GITHUB_RUN_ATTEMPT)
      - name: 當地量測 managed 原生程式完整計數點
        run: |
          & .\script\test\managed_coverage.ps1 -SourceRoot $PWD.Path -OutputDirectory (Join-Path $env:RUNNER_TEMP 'managed-coverage') -Runtime
      - name: 下載同次與同 attempt 的完整 PowerShell 四片
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: powershell-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/powershell-shards
          merge-multiple: false
      - name: 下載同次與同 attempt 的完整計時收據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: powershell-timing-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/powershell-timings
          merge-multiple: false
      - name: 收集 PowerShell 與 C# runtime 覆蓋率並強制完整八成
        run: |
          & .\script\test\run_repo_coverage.ps1 -SourceRoot $PWD.Path -PublicDirectory (Join-Path $env:RUNNER_TEMP 'native-stage-import/report') -ManagedEvidencePath (Join-Path $env:RUNNER_TEMP 'managed-coverage/evidence.json') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'repo-coverage') -PowerShellShardDirectory (Join-Path $env:RUNNER_TEMP 'powershell-shards') -PowerShellTimingDirectory (Join-Path $env:RUNNER_TEMP 'powershell-timings') -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
      - name: 保留已核對完整清單的計時收據七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-timing-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repo-coverage/timing/timing.json
          retention-days: 7
          if-no-files-found: error
      - name: 顯示已驗證的同次品質摘要
        run: |
          . .\script\test\ci_quality_summary.ps1
          $report=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'native-stage-import/report/summary.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          New-CIQualitySummary -Report $report -AggregationState 'success' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
      - name: 短期保留去識別整體證據七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repo-coverage/coverage/repo_coverage.json
            ${{ runner.temp }}/repo-coverage/coverage/coverage_inventory.json
            ${{ runner.temp }}/repo-coverage/coverage/coverage.xml
          retention-days: 7
          if-no-files-found: error
      - name: 彙整失敗仍匯出安全 PowerShell 原始證據
        if: always()
        run: |
          . .\script\test\ci_tasks.ps1
          Export-CIPowerShellRawEvidence -SourceRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
      - name: 僅保留安全 PowerShell 原始證據七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-raw-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/powershell-raw-public/
          retention-days: 7
          if-no-files-found: ignore
      - name: 僅發布完整八成通過的正式測試報告
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage-import/report/
          retention-days: 7
          if-no-files-found: error

  requirements-gate:
    name: requirements-gate
    if: always() && needs.coverage-aggregation.result != 'cancelled'
    needs: [coverage-aggregation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得本次來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 下載同次 PS5.1 真實報告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-artifact
      - name: 下載同次 native-stage 報告以檢查兩階段來源
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-native-stage
      - name: 下載本次實際產生的合成首頁樣本
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: requirements-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-fixture
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 驗證 native-stage 的 Branch 與 Release CLI 情境
        env:
          WINDOWS_SETUP_ARTIFACT_DIR: ${{ github.workspace }}/acceptance-native-stage/report
          WINDOWS_SETUP_PORTAL_FIXTURE_DIR: ${{ github.workspace }}/acceptance-fixture
        run: go test -count=1 ./test/go/integration -run '^TestCLICommands$'
      - name: 執行需求驗收與破壞性負例
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_SETUP_ARTIFACT_DIR: ${{ github.workspace }}/acceptance-artifact
          WINDOWS_SETUP_PORTAL_FIXTURE_DIR: ${{ github.workspace }}/acceptance-fixture
        run: |
          go test -count=1 ./...
          go run ./script/test/requirements_gate --require-runtime --artifact-dir acceptance-artifact --source-root . --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL"
          go run ./script/test/repo_coverage_tool verify --runtime --artifact-dir acceptance-artifact --source-root . --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL" --require-complete --minimum-percent 80

  docker-tests:
    name: docker-tests
    runs-on: windows-2022
    timeout-minutes: 125
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 取得容器測試來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 確認真實 Windows Docker 能力
        timeout-minutes: 3
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\runner_daemon.ps1')
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','doctor','-Isolation','process')
      - name: 建置同來源的 Windows 工具映像並保存精確收據
        timeout-minutes: 60
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','build','-Isolation','process','-BuildReceiptPath',(Join-Path $env:RUNNER_TEMP 'windows-container-image.json'))
      - name: 驗證精確映像健康與逾時
        timeout-minutes: 4
        run: |
          . .\script\docker\library.ps1
          . .\script\docker\runner_daemon_library.ps1
          . .\script\docker\container_health_ci.ps1
          $context = Get-ContainerContext -Root $env:GITHUB_WORKSPACE -ReportDirectory (Join-Path $env:RUNNER_TEMP 'health-probe-unused') -Isolation process
          $image = Assert-ContainerBuildReceipt -Context $context -Path (Join-Path $env:RUNNER_TEMP 'windows-container-image.json')
          Invoke-CIContainerHealthVerification -ImageId $image
      - name: 在已核對映像執行全部 Windows 隔離測試
        timeout-minutes: 35
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','test-built','-Isolation','process','-BuildReceiptPath',(Join-Path $env:RUNNER_TEMP 'windows-container-image.json'),'-ReportDirectory',(Join-Path $env:RUNNER_TEMP 'windows-container-results'))
      - name: 證明真實容器失敗會保留非零退出碼
        timeout-minutes: 5
        run: |
          . .\script\docker\library.ps1
          . .\script\test\ci_tasks.ps1
          $context = Get-ContainerContext -Root $env:GITHUB_WORKSPACE -ReportDirectory (Join-Path $env:RUNNER_TEMP 'failure-probe-unused') -Isolation process
          $image = Assert-ContainerBuildReceipt -Context $context -Path (Join-Path $env:RUNNER_TEMP 'windows-container-image.json')
          Assert-CIDockerFailure -Image $image
      - name: 驗證容器真實報告與來源
        timeout-minutes: 5
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $public = Join-Path $env:RUNNER_TEMP 'windows-container-results/public'
          . .\script\test\ci_tasks.ps1
          Assert-CIContainerReport -Directory $public
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/requirements_gate','--tests-only','--artifact-dir',$public,'--source-root','.','--expected-sha',$env:EXPECTED_SHA,'--expected-run-url',$env:EXPECTED_RUN_URL)
      - name: 僅保留容器去識別報告七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-container-results/public/
          retention-days: 7
          if-no-files-found: error

  ci-rollup:
    name: ci-rollup
    if: always()
    needs: [isolated-tests, requirements-gate, docker-tests, oobe_payload_inspection, powershell-coverage, coverage-aggregation]
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: 取得已測試的工作門檻
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 確認全部必要測試成功
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.isolated-tests.result }}
          REQUIREMENTS_RESULT: ${{ needs.requirements-gate.result }}
          DOCKER_RESULT: ${{ needs.docker-tests.result }}
          OOBE_PAYLOAD_RESULT: ${{ needs.oobe_payload_inspection.result }}
          POWERSHELL_COVERAGE_RESULT: ${{ needs.powershell-coverage.result }}
          COVERAGE_RESULT: ${{ needs.coverage-aggregation.result }}
        run: |
          . .\script\test\ci_tasks.ps1
          . .\script\test\ci_quality_summary.ps1
          $states=@{Tests=$env:TEST_RESULT;Requirements=$env:REQUIREMENTS_RESULT;Docker=$env:DOCKER_RESULT;Payload=$env:OOBE_PAYLOAD_RESULT;PowerShellCoverage=$env:POWERSHELL_COVERAGE_RESULT;Coverage=$env:COVERAGE_RESULT}
          Write-CIQualityFailureSummary -States $states -SummaryPath $env:GITHUB_STEP_SUMMARY
          Assert-CIResults $states

  release:
    name: 發布 GitHub 來源版本
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ci-rollup]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 取得完整已驗證歷史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 驗證版本並產生當版說明
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          . .\script\release\release.ps1
          Assert-ReleaseOnMain -PackageRoot $PWD.Path -Revision $env:SOURCE_COMMIT
          $release = .\script\release\build_source_release.ps1 -Version $env:RELEASE_TAG -Revision $env:SOURCE_COMMIT -OutputDirectory "$env:RUNNER_TEMP\release-notes"
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: release
      - name: 發布前核對該版本報表入口
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . .\script\release\release.ps1
          $notes = [IO.File]::ReadAllText("$env:RUNNER_TEMP\release-notes\release_notes.md", [Text.UTF8Encoding]::new($false, $true))
          Assert-ReleaseReportLink -Version $env:RELEASE_TAG -Notes $notes
      - name: 準備固定的證據驗證工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 建立真正整體覆蓋率驗證器
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
        run: |
          go build -o $env:WINDOWS_SETUP_COVERAGE_TOOL ./script/test/repo_coverage_tool
      - name: 下載同一次執行的去識別品質證據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 下載同一次執行的容器報告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 封裝並驗證當版完整報表
        shell: powershell
        run: |
          .\script\report\build_release_bundle.ps1
      - name: 草稿附齊品質證據後發布不可變版本
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
          WINDOWS_SETUP_REPORT_BUNDLE_TOOL: ${{ runner.temp }}/report_bundle_tool.exe
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $arguments = @{PublicDirectory=(Join-Path $env:RUNNER_TEMP ("windows-test-reports-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT));ContainerDirectory=(Join-Path $env:RUNNER_TEMP ("docker-test-reports-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT));ReportArchive=(Join-Path $env:RUNNER_TEMP ("windows_setup_report_"+$env:RELEASE_TAG+".zip"));RunAttempt=[int]$env:GITHUB_RUN_ATTEMPT;RunUrl=("https://github.com/"+$env:GITHUB_REPOSITORY+"/actions/runs/"+$env:GITHUB_RUN_ID);Version=$env:RELEASE_TAG;Commit=$env:SOURCE_COMMIT;NotesPath="$env:RUNNER_TEMP\release-notes\release_notes.md";Repository=$env:GH_REPO;Prerelease=($env:IS_PRERELEASE -eq 'true')}
          .\script\report\publish_quality_release.ps1 @arguments

  build-portal:
    name: 建立 main 與不可變版本品質索引
    if: always() && needs.ci-rollup.result == 'success' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'))
    needs: [coverage-aggregation, requirements-gate, docker-tests, release, ci-rollup]
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    concurrency:
      group: pages-report
      cancel-in-progress: false
    steps:
      - name: 取得受保護 main 的報表產生器
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: 準備固定的證據驗證工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 建立真正整體覆蓋率驗證器
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
          WINDOWS_SETUP_REPORT_BUNDLE_TOOL: ${{ runner.temp }}/report_bundle_tool.exe
        run: |
          go build -o $env:WINDOWS_SETUP_COVERAGE_TOOL ./script/test/repo_coverage_tool
          go build -o $env:WINDOWS_SETUP_REPORT_BUNDLE_TOOL ./script/test/report_bundle_tool
      - name: 核對版本品質附件並本地產生索引
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
          WINDOWS_SETUP_REPORT_BUNDLE_TOOL: ${{ runner.temp }}/report_bundle_tool.exe
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          . .\script\test\ci_tasks.ps1
          $parameters = Get-CIPortalParameters -Repository $env:GH_REPO -OutputDirectory "$env:RUNNER_TEMP\portal-inputs" -EventRef $env:EVENT_REF -RunId $env:CURRENT_RUN -EventName $env:EVENT_NAME -RunAttempt ([int]$env:CURRENT_ATTEMPT)
          $inputs = .\script\report\get_portal_inputs.ps1 @parameters
          .\script\report\build_portal.ps1 -CatalogPath $inputs.CatalogPath -MainSnapshotPath $inputs.MainSnapshotPath -ContainerSnapshotPath $inputs.ContainerSnapshotPath -OutputDirectory "$env:RUNNER_TEMP\quality-portal"
      - name: 保存去識別 portal 供 Linux 部署
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-portal/
          retention-days: 7
          if-no-files-found: error

  publish-reports:
    name: 發布 Pages 品質入口
    needs: [build-portal]
    if: always() && needs.build-portal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下載已驗證的品質入口
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: portal
      - name: 準備 Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: portal
          retention-days: 7
      - name: 發布 Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify-deployment:
    name: 公開部署需求驗收
    needs: [publish-reports]
    if: always() && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && needs.publish-reports.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    steps:
      - name: 取得本次驗收程式與 README
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 取得同次已驗證入口產物
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-portal
      - name: 取得不可變最新版本
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPO/releases/latest" > "$RUNNER_TEMP/latest-release.json"
      - name: 匿名核對公開網站與本次來源
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LATEST_RELEASE_METADATA: ${{ github.event_name == 'workflow_dispatch' && format('{0}/latest-release.json', runner.temp) || '' }}
        run: |
          go run ./script/test/verify_deployment --base-url https://ycpss91255.github.io/windows_setup/ --readme readme.md --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL" --portal-dir "$RUNNER_TEMP/verified-portal" --latest-release-metadata "$LATEST_RELEASE_METADATA"

      - name: 匿名核對公開版本與不可變證據
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-metadata.json"
          go build -o "$RUNNER_TEMP/report-bundle-tool" ./script/test/report_bundle_tool
          go run ./script/test/verify_deployment --mode release --require-runtime --base-url https://ycpss91255.github.io/windows_setup/ --readme readme.md --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL" --tag "$RELEASE_TAG" --release-metadata "$RUNNER_TEMP/release-metadata.json" --report-bundle-tool "$RUNNER_TEMP/report-bundle-tool" --report-archive "$RUNNER_TEMP/tag-report-download/windows_setup_report_${RELEASE_TAG}.zip" --run-attempt "$GITHUB_RUN_ATTEMPT" --download-release-asset --release-repository "$RELEASE_REPO"
