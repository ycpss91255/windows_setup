name: Windows 測試
run-name: "${{ github.event_name }} · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number || '?', github.event.pull_request.title || github.ref_name || '(unknown ref)') || format('{0} · {1}', github.ref_name || '(unknown ref)', github.sha || '(unknown SHA)') }}"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOFLAGS: "-mod=vendor"
  CGO_ENABLED: "0"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-preflight:
    name: PR 來源前置核對
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得此事件的實際快照
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 取得目前 PR 身分並核對事件來源
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREFLIGHT_EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-authority.json"
          go run ./script/test/pr_source_preflight -repo . -event "$GITHUB_EVENT_PATH" -authority "$RUNNER_TEMP/pr-authority.json" -checkout "$(git rev-parse HEAD)" -run-sha "$GITHUB_SHA" -base "$EVENT_BASE" -head "$EVENT_HEAD"

      - name: 嚴格核對合併佇列分組（同倉庫、由 base 合成、實際 tree）
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          gh api graphql -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { mergeQueue(branch: "main") { entries(first: 100) { nodes { position headCommit { oid } pullRequest { number isCrossRepository headRepository { nameWithOwner } } } } } } }' -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" > "$RUNNER_TEMP/merge-queue.json"
          go run ./script/test/pr_source_preflight -mode merge-group -repo . -event "$GITHUB_EVENT_PATH" -queue "$RUNNER_TEMP/merge-queue.json" -repository "$GITHUB_REPOSITORY" -checkout "$(git rev-parse HEAD)" -run-sha "$GITHUB_SHA"

  classify:
    name: PR 變更分類
    needs: [source-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      select_tests: ${{ steps.classify.outputs.select_tests || steps.fallback.outputs.select_tests }}
      select_powershell_coverage: ${{ steps.classify.outputs.select_powershell_coverage || steps.fallback.outputs.select_powershell_coverage }}
      select_coverage_aggregation: ${{ steps.classify.outputs.select_coverage_aggregation || steps.fallback.outputs.select_coverage_aggregation }}
      select_requirements_gate: ${{ steps.classify.outputs.select_requirements_gate || steps.fallback.outputs.select_requirements_gate }}
      select_docker_tests: ${{ steps.classify.outputs.select_docker_tests || steps.fallback.outputs.select_docker_tests }}
      select_oobe_payload: ${{ steps.classify.outputs.select_oobe_payload || steps.fallback.outputs.select_oobe_payload }}
      select_doc_checks: ${{ steps.classify.outputs.select_doc_checks || steps.fallback.outputs.select_doc_checks }}
      select_go_tests: ${{ steps.classify.outputs.select_go_tests || steps.fallback.outputs.select_go_tests || 'false' }}
      shard_count: ${{ steps.classify.outputs.shard_count || steps.fallback.outputs.shard_count || '1' }}
      shard_matrix: ${{ steps.classify.outputs.shard_matrix || steps.fallback.outputs.shard_matrix || '[0]' }}
      docker_shard_count: ${{ steps.docker_shards.outputs.docker_shard_count }}
      docker_shard_matrix: ${{ steps.docker_shards.outputs.docker_shard_matrix }}
      pr_full: ${{ steps.classify.outputs.pr_full || steps.fallback.outputs.pr_full || 'false' }}
      test_scope: ${{ steps.classify.outputs.test_scope || steps.fallback.outputs.test_scope }}
      affected_tests: ${{ steps.classify.outputs.affected_tests }}
      doc_tests: ${{ steps.classify.outputs.doc_tests }}
      classify_fallback: ${{ steps.classify.outputs.classify_fallback || steps.fallback.outputs.classify_fallback || 'false' }}
    steps:
      - name: 取得完整歷史以計算 PR 變更
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 取得基底版本的分類規則
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base-source
          persist-credentials: false
      - name: 在 Linux 以暫時倉庫確認分類器不會退回完整套件
        shell: pwsh
        run: |
          . ./script/test/ci_classify_smoke.ps1
          Invoke-CIClassifierSmoke -ClassifierPath ./script/test/ci_classify.ps1 | Out-Null
      - name: 依 repo 變數決定容器測試分片數（與變更分類無關）
        id: docker_shards
        shell: pwsh
        env:
          DOCKER_SHARDS: ${{ vars.DOCKER_SHARDS }}
        run: |
          . ./script/test/container_shards.ps1
          $plan = Get-CIContainerShardPlan -Value $env:DOCKER_SHARDS
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @(('docker_shard_count=' + $plan.Count), ('docker_shard_matrix=' + $plan.Matrix))
          Write-Host ('容器測試分片數 = ' + $plan.Count + '：' + $plan.Matrix)
      - name: 以基底版本的規則依 diff 選出受影響的工作
        id: classify
        continue-on-error: true
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          & ./base-source/script/test/ci_classify.ps1 -EventName $env:EVENT_NAME -BaseRef ('origin/' + $env:BASE_REF) -Root $PWD.Path -OutputPath $env:GITHUB_OUTPUT
      - name: 分類失敗時改跑完整套件
        id: fallback
        if: steps.classify.outcome != 'success'
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @('select_tests=true','select_powershell_coverage=true','select_coverage_aggregation=true','select_requirements_gate=true','select_docker_tests=true','select_oobe_payload=true','select_doc_checks=false','select_go_tests=false','shard_count=1','shard_matrix=[0]','pr_full=false','test_scope=full','classify_fallback=true')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @('## PR 變更分類步驟失敗，改跑完整套件','','CI 加速未生效；請查看 classify 工作的記錄。')

  doc-checks:
    name: 文件輕量檢查
    needs: [classify]
    if: needs.classify.outputs.select_doc_checks == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 只執行引用被改文件的測試與全域契約測試
        shell: powershell
        env:
          DOC_TESTS: ${{ needs.classify.outputs.doc_tests }}
        run: |
          & .\script\test\run_ci.ps1 -Layer All -ReportDirectory (Join-Path $env:RUNNER_TEMP 'doc-checks') -Suite ($env:DOC_TESTS -split ',')

  oobe_payload_inspection:
    needs: [source-preflight, classify]
    if: needs.classify.outputs.select_oobe_payload == 'true'
    name: 設定包唯讀內容驗證
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 檢查設定包三檔來源與實際雜湊
        shell: powershell
        run: |
          .\test\powershell\integration\provisioning_source_tests.ps1
      - name: 唯讀抽取並核對已審查內容
        id: payload
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path ([IO.Path]::GetTempPath()) ('windows-setup-oobe-' + [guid]::NewGuid().ToString('N'))
          "evidence=$evidence" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\script\test\verify_oobe_payload.ps1 -PackagePath .\modules\init\assets\hide_oobe.ppkg -EvidenceDirectory $evidence -BaselinePath .\modules\init\assets\payload_baseline.json
      - name: 保留內容驗證證據七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oobe-payload-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.payload.outputs.evidence }}
          retention-days: 7
          if-no-files-found: warn

      - name: 唯讀抽取開始功能表設定包並保留待審查內容
        id: start_payload
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path ([IO.Path]::GetTempPath()) ('windows-setup-start-pins-' + [guid]::NewGuid().ToString('N'))
          "evidence=$evidence" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\script\test\verify_start_pins_payload.ps1 -PackagePath .\modules\start_menu\assets\empty_start.ppkg -EvidenceDirectory $evidence -BaselinePath .\modules\start_menu\assets\payload_baseline.json
      - name: 保留開始功能表七個 XML 與未通過診斷七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: start-pins-payload-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.start_payload.outputs.evidence }}/evidence.json
            ${{ steps.start_payload.outputs.evidence }}/payload/**/*.xml
            ${{ steps.start_payload.outputs.evidence }}/payload/**/*.provxml
          retention-days: 7
          if-no-files-found: warn

  powershell-coverage:
    needs: [source-preflight, classify]
    if: needs.classify.outputs.select_powershell_coverage == 'true'
    name: PowerShell 全源量測分片 ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得同次原始碼與完整測試清單
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 維護工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 準備固定 managed 維護編譯器
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: 準備固定的 workflow 語義檢查器
        run: |
          . .\script\docker\install_managed_tools.ps1
          $artifact = Get-ContainerWorkflowLintArtifact
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint-1.7.12'
          Install-ContainerToolArtifact -Artifact $artifact -Destination $directory -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'actionlint-download')
          "WINDOWS_SETUP_ACTIONLINT=$(Join-Path $directory 'actionlint.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: 真實執行分配的 Pester suites 並保留全部來源分母
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          . .\script\test\ci_quality_summary.ps1
          Invoke-CIShardTimed -ShardIndex ([int]$env:SHARD_INDEX) -SummaryPath $env:GITHUB_STEP_SUMMARY -Action {
            .\script\test\powershell_coverage_shard.ps1 -SourceRoot $PWD.Path -OutputDirectory (Join-Path $env:RUNNER_TEMP 'powershell-shard-public') -PrivateDirectory (Join-Path $env:RUNNER_TEMP 'powershell-shard-private') -TimingDirectory (Join-Path $env:RUNNER_TEMP 'powershell-timing-public') -ShardIndex ([int]$env:SHARD_INDEX) -ShardCount 4 -Commit $env:GITHUB_SHA -RunUrl ("https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
          }
      - name: 僅保留已驗證的相對路徑分片證據七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/powershell-shard-public/
          retention-days: 7
          if-no-files-found: error

      - name: 保留各 suite 階段時間七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-timing-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/powershell-timing-public/
          retention-days: 7
          if-no-files-found: error
  isolated-tests:
    needs: [source-preflight, classify]
    if: needs.classify.outputs.select_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.classify.outputs.shard_matrix) }}
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 準備固定 Go 覆蓋率工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 準備固定 managed 維護編譯器
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: 列出 runner 本機 SDK
        run: |
          dotnet --list-sdks
      - name: 準備固定的 workflow 語義檢查器
        run: |
          . .\script\docker\install_managed_tools.ps1
          $artifact = Get-ContainerWorkflowLintArtifact
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint-1.7.12'
          Install-ContainerToolArtifact -Artifact $artifact -Destination $directory -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'actionlint-download')
          "WINDOWS_SETUP_ACTIONLINT=$(Join-Path $directory 'actionlint.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: 執行 Windows PowerShell 5.1 隔離測試
        if: needs.classify.outputs.test_scope != 'scoped'
        run: |
          & .\script\test\run_ci.ps1 -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results')
      - name: 只執行受影響的 Windows PowerShell 5.1 隔離測試
        if: needs.classify.outputs.test_scope == 'scoped'
        env:
          AFFECTED_TESTS: ${{ needs.classify.outputs.affected_tests }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.classify.outputs.shard_count }}
        run: |
          & .\script\test\run_ci.ps1 -Layer All -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results') -Parallelism 2 -ShardIndex ([int]$env:SHARD_INDEX) -ShardCount ([int]$env:SHARD_COUNT) -Suite ($env:AFFECTED_TESTS -split ',')
      - name: 顯示固定失敗測試的有限診斷
        if: failure() && needs.classify.outputs.test_scope != 'scoped'
        run: |
          . .\script\test\ci_tasks.ps1
          Write-CIFailureDiagnostics -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results') -SuiteNames @('Unit.uac_helpers','Integration.managed_catalog','Unit.driver_cache_cleanup','Integration.init_runtime','Integration.driver_full_source_coverage','Integration.report_bundle_publication','Integration.ci_runner_coverage')
      - name: 產生明確標示的合成首頁驗收樣本
        if: always() && needs.classify.outputs.test_scope != 'scoped'
        run: |
          & .\script\test\create_portal_fixture.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'requirements-fixture')
      - name: 核對本次新增合併提交標題
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/commitlint/mergecheck')
      - name: 執行全部 Go 維護工具測試
        if: needs.classify.outputs.test_scope != 'scoped'
        env:
          WINDOWS_SETUP_ARTIFACT_DIR: ${{ runner.temp }}/NUC-CI-Results/public
          WINDOWS_SETUP_PORTAL_FIXTURE_DIR: ${{ runner.temp }}/requirements-fixture/portal
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('test','-mod=vendor','-count=1','./...')
      - name: 驗證手機與桌面報表明細排版
        if: needs.classify.outputs.test_scope != 'scoped'
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CIReportLayout
      - name: 封裝尚未完成 runtime 覆蓋率的原生證據
        if: needs.classify.outputs.test_scope != 'scoped'
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/repo_coverage_tool','native-stage-pack','--runtime','--source-root',$PWD.Path,'--report-dir',(Join-Path $env:RUNNER_TEMP 'NUC-CI-Results/public'),'--output-dir',(Join-Path $env:RUNNER_TEMP 'native-stage'),'--expected-sha',$env:GITHUB_SHA,'--expected-run-url',("https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"),'--run-attempt',$env:GITHUB_RUN_ATTEMPT)
      - name: 僅保留不可發布的同次原生中介證據七天
        if: needs.classify.outputs.test_scope != 'scoped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage/
          retention-days: 7
          if-no-files-found: error
      - name: 保留合成驗收樣本七天
        if: always() && needs.classify.outputs.test_scope != 'scoped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: requirements-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-fixture/portal/
          retention-days: 7
          if-no-files-found: error
  go-tests:
    name: Go 維護工具單元測試
    needs: [source-preflight, classify]
    if: needs.classify.outputs.select_go_tests == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 準備固定 Go 覆蓋率工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 執行 Go 維護工具單元測試（不含整合測試）
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CIGoUnitTests
  managed-coverage:
    name: managed 原生程式量測
    needs: [source-preflight, classify]
    if: needs.classify.outputs.select_coverage_aggregation == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得相同量測來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備本次 managed 量測編譯器
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: 當地量測 managed 原生程式完整計數點
        run: |
          & .\script\test\managed_coverage.ps1 -SourceRoot $PWD.Path -OutputDirectory (Join-Path $env:RUNNER_TEMP 'managed-coverage') -Runtime
      - name: 僅保留聚合所需的 managed 證據七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/managed-coverage/evidence.json
            ${{ runner.temp }}/managed-coverage/catalog.json
            ${{ runner.temp }}/managed-coverage/merged.coverage
            ${{ runner.temp }}/managed-coverage/merged.xml
            ${{ runner.temp }}/managed-coverage/bin/windows_setup_managed.dll
            ${{ runner.temp }}/managed-coverage/bin/windows_setup_managed.pdb
            ${{ runner.temp }}/managed-coverage/shards/*.coverage
            ${{ runner.temp }}/managed-coverage/shards/*.xml
          retention-days: 7
          if-no-files-found: error

  coverage-aggregation:
    name: 同次完整覆蓋率聚合
    needs: [classify, isolated-tests, powershell-coverage, managed-coverage]
    if: needs.classify.outputs.select_coverage_aggregation == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得相同量測來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 證據工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 下載同次與同 attempt 的原生中介證據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage-input
      - name: 先核對原位元組身分與未完成狀態才還原
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/repo_coverage_tool','native-stage-restore','--runtime','--source-root',$PWD.Path,'--input-dir',(Join-Path $env:RUNNER_TEMP 'native-stage-input'),'--output-dir',(Join-Path $env:RUNNER_TEMP 'native-stage-import'),'--expected-sha',$env:GITHUB_SHA,'--expected-run-url',("https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"),'--run-attempt',$env:GITHUB_RUN_ATTEMPT)
      - name: 下載同次與同 attempt 的 managed 原生量測證據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: managed-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-coverage
      - name: 下載同次與同 attempt 的完整 PowerShell 四片
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: powershell-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/powershell-shards
          merge-multiple: false
      - name: 下載同次與同 attempt 的完整計時收據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: powershell-timing-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/powershell-timings
          merge-multiple: false
      - name: 收集 PowerShell 與 C# runtime 覆蓋率並強制完整八成
        run: |
          & .\script\test\run_repo_coverage.ps1 -SourceRoot $PWD.Path -PublicDirectory (Join-Path $env:RUNNER_TEMP 'native-stage-import/report') -ManagedEvidencePath (Join-Path $env:RUNNER_TEMP 'managed-coverage/evidence.json') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'repo-coverage') -PowerShellShardDirectory (Join-Path $env:RUNNER_TEMP 'powershell-shards') -PowerShellTimingDirectory (Join-Path $env:RUNNER_TEMP 'powershell-timings') -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT)
      - name: 保留已核對完整清單的計時收據七天
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-timing-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repo-coverage/timing/timing.json
          retention-days: 7
          if-no-files-found: error
      - name: 顯示已驗證的同次品質摘要
        run: |
          . .\script\test\ci_quality_summary.ps1
          $report=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'native-stage-import/report/summary.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          New-CIQualitySummary -Report $report -AggregationState 'success' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
      - name: 短期保留去識別整體證據七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repo-coverage/coverage/repo_coverage.json
            ${{ runner.temp }}/repo-coverage/coverage/coverage_inventory.json
            ${{ runner.temp }}/repo-coverage/coverage/coverage.xml
          retention-days: 7
          if-no-files-found: error
      - name: 彙整失敗仍匯出安全 PowerShell 原始證據
        if: always()
        run: |
          . .\script\test\ci_tasks.ps1
          Export-CIPowerShellRawEvidence -SourceRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
      - name: 僅保留安全 PowerShell 原始證據七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-raw-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/powershell-raw-public/
          retention-days: 7
          if-no-files-found: ignore
      - name: 僅發布完整八成通過的正式測試報告
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-stage-import/report/
          retention-days: 7
          if-no-files-found: error

  requirements-gate:
    name: requirements-gate
    if: always() && needs.classify.outputs.select_requirements_gate == 'true' && needs.coverage-aggregation.result != 'cancelled'
    needs: [classify, coverage-aggregation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得本次來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 下載同次 PS5.1 真實報告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-artifact
      - name: 下載同次 native-stage 報告以檢查兩階段來源
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-native-stage
      - name: 下載本次實際產生的合成首頁樣本
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: requirements-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-fixture
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 驗證 native-stage 的 Branch 與 Release CLI 情境
        env:
          WINDOWS_SETUP_ARTIFACT_DIR: ${{ github.workspace }}/acceptance-native-stage/report
          WINDOWS_SETUP_PORTAL_FIXTURE_DIR: ${{ github.workspace }}/acceptance-fixture
        run: go test -count=1 ./test/go/integration -run '^TestCLICommands$'
      - name: 執行需求驗收與破壞性負例
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_SETUP_ARTIFACT_DIR: ${{ github.workspace }}/acceptance-artifact
          WINDOWS_SETUP_PORTAL_FIXTURE_DIR: ${{ github.workspace }}/acceptance-fixture
        run: |
          go test -count=1 ./...
          go run ./script/test/requirements_gate --require-runtime --artifact-dir acceptance-artifact --source-root . --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL"
          go run ./script/test/repo_coverage_tool verify --runtime --artifact-dir acceptance-artifact --source-root . --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL" --require-complete --minimum-percent 80

  docker-test-shards:
    needs: [source-preflight, classify]
    if: needs.classify.outputs.select_docker_tests == 'true'
    name: docker-tests 分片 ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.classify.outputs.docker_shard_matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 取得容器測試來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 確認真實 Windows Docker 能力
        timeout-minutes: 3
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\runner_daemon.ps1')
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','doctor','-Isolation','process')
      - name: 建置同來源的 Windows 工具映像並保存精確收據
        timeout-minutes: 60
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','build','-Isolation','process','-BuildReceiptPath',(Join-Path $env:RUNNER_TEMP 'windows-container-image.json'))
      - name: 驗證精確映像健康與逾時
        timeout-minutes: 4
        run: |
          . .\script\docker\library.ps1
          . .\script\docker\runner_daemon_library.ps1
          . .\script\docker\container_health_ci.ps1
          $context = Get-ContainerContext -Root $env:GITHUB_WORKSPACE -ReportDirectory (Join-Path $env:RUNNER_TEMP 'health-probe-unused') -Isolation process
          $image = Assert-ContainerBuildReceipt -Context $context -Path (Join-Path $env:RUNNER_TEMP 'windows-container-image.json')
          Invoke-CIContainerHealthVerification -ImageId $image
      - name: 在已核對映像執行本分片的 Windows 隔離測試
        timeout-minutes: 35
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.classify.outputs.docker_shard_count }}
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','test-built','-Isolation','process','-BuildReceiptPath',(Join-Path $env:RUNNER_TEMP 'windows-container-image.json'),'-ReportDirectory',(Join-Path $env:RUNNER_TEMP 'windows-container-results'),'-ShardIndex',$env:SHARD_INDEX,'-ShardCount',$env:SHARD_COUNT)
      - name: 證明真實容器失敗會保留非零退出碼
        timeout-minutes: 5
        run: |
          . .\script\docker\library.ps1
          . .\script\test\ci_tasks.ps1
          $context = Get-ContainerContext -Root $env:GITHUB_WORKSPACE -ReportDirectory (Join-Path $env:RUNNER_TEMP 'failure-probe-unused') -Isolation process
          $image = Assert-ContainerBuildReceipt -Context $context -Path (Join-Path $env:RUNNER_TEMP 'windows-container-image.json')
          Assert-CIDockerFailure -Image $image
      - name: 驗證分片報告來自實際 Windows 容器
        timeout-minutes: 5
        if: always()
        run: |
          $public = Join-Path $env:RUNNER_TEMP 'windows-container-results/public'
          . .\script\test\ci_tasks.ps1
          Assert-CIContainerReport -Directory $public
      - name: 保留本分片容器去識別報告七天供合併
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-shard-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/windows-container-results/public/
            ${{ runner.temp }}/windows-container-results/shard.json
          retention-days: 7
          if-no-files-found: error

  docker-tests:
    # 必要檢查名稱維持 docker-tests：任一分片失敗、缺少或被略過都不能通過；
    # 容器內 Go 驗收由第 0 份完成；合併後的完整容器報告沿用原附件名稱，供需求閘門、發布與品質索引使用。
    needs: [source-preflight, classify, docker-test-shards]
    if: always() && needs.classify.outputs.select_docker_tests == 'true'
    name: docker-tests
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得容器測試來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 確認全部容器分片成功
        env:
          SHARDS_RESULT: ${{ needs.docker-test-shards.result }}
        run: |
          . .\script\test\container_shards.ps1
          Assert-CIContainerShardsResult -Result $env:SHARDS_RESULT
      - name: 下載同次全部容器分片報告
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: docker-shard-reports-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/docker-shards
      - name: 核對分片互不重疊且聯集完整後合併成完整容器報告
        if: always()
        timeout-minutes: 5
        env:
          SHARD_COUNT: ${{ needs.classify.outputs.docker_shard_count }}
        run: |
          . .\script\test\container_shards.ps1
          $null = Merge-CIContainerShardReports -ShardRoot (Join-Path $env:RUNNER_TEMP 'docker-shards') -ShardCount ([int]$env:SHARD_COUNT) -PackageRoot $PWD.Path -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-container-results/public')
          Get-Content (Join-Path $env:RUNNER_TEMP 'windows-container-results/public/summary.md') -Encoding UTF8 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
      - name: 僅保留合併後的容器去識別報告七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-container-results/public/
          retention-days: 7
          if-no-files-found: error
      - name: 驗證合併後容器報告與來源
        timeout-minutes: 5
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $public = Join-Path $env:RUNNER_TEMP 'windows-container-results/public'
          . .\script\test\ci_tasks.ps1
          Assert-CIContainerReport -Directory $public
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/requirements_gate','--tests-only','--artifact-dir',$public,'--source-root','.','--expected-sha',$env:EXPECTED_SHA,'--expected-run-url',$env:EXPECTED_RUN_URL)

  ci-rollup:
    name: ci-rollup
    if: always()
    needs: [classify, doc-checks, isolated-tests, go-tests, requirements-gate, docker-tests, oobe_payload_inspection, powershell-coverage, coverage-aggregation]
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: 取得已測試的工作門檻
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 確認全部必要測試成功
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.isolated-tests.result }}
          REQUIREMENTS_RESULT: ${{ needs.requirements-gate.result }}
          DOCKER_RESULT: ${{ needs.docker-tests.result }}
          OOBE_PAYLOAD_RESULT: ${{ needs.oobe_payload_inspection.result }}
          POWERSHELL_COVERAGE_RESULT: ${{ needs.powershell-coverage.result }}
          COVERAGE_RESULT: ${{ needs.coverage-aggregation.result }}
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CLASSIFY_FALLBACK: ${{ needs.classify.outputs.classify_fallback }}
          DOC_CHECKS_RESULT: ${{ needs.doc-checks.result }}
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          SELECT_TESTS: ${{ needs.classify.outputs.select_tests }}
          SELECT_REQUIREMENTS: ${{ needs.classify.outputs.select_requirements_gate }}
          SELECT_DOCKER: ${{ needs.classify.outputs.select_docker_tests }}
          SELECT_PAYLOAD: ${{ needs.classify.outputs.select_oobe_payload }}
          SELECT_POWERSHELL_COVERAGE: ${{ needs.classify.outputs.select_powershell_coverage }}
          SELECT_COVERAGE: ${{ needs.classify.outputs.select_coverage_aggregation }}
          SELECT_DOC_CHECKS: ${{ needs.classify.outputs.select_doc_checks }}
          SELECT_GO_TESTS: ${{ needs.classify.outputs.select_go_tests }}
        run: |
          . .\script\test\ci_tasks.ps1
          . .\script\test\ci_quality_summary.ps1
          $states=@{Tests=$env:TEST_RESULT;Requirements=$env:REQUIREMENTS_RESULT;Docker=$env:DOCKER_RESULT;Payload=$env:OOBE_PAYLOAD_RESULT;PowerShellCoverage=$env:POWERSHELL_COVERAGE_RESULT;Coverage=$env:COVERAGE_RESULT;Classify=$env:CLASSIFY_RESULT;DocChecks=$env:DOC_CHECKS_RESULT;GoTests=$env:GO_TESTS_RESULT}
          $selection=@{Tests=$env:SELECT_TESTS;Requirements=$env:SELECT_REQUIREMENTS;Docker=$env:SELECT_DOCKER;Payload=$env:SELECT_PAYLOAD;PowerShellCoverage=$env:SELECT_POWERSHELL_COVERAGE;Coverage=$env:SELECT_COVERAGE;DocChecks=$env:SELECT_DOC_CHECKS;GoTests=$env:SELECT_GO_TESTS}
          $states=Resolve-CIRollupStates -Results $states -Selection $selection -EventName $env:EVENT_NAME
          Write-CIQualityFailureSummary -States $states -SummaryPath $env:GITHUB_STEP_SUMMARY
          Write-CIClassifyFallbackNotice -Fallback $env:CLASSIFY_FALLBACK -SummaryPath $env:GITHUB_STEP_SUMMARY
          Assert-CIResults $states

  release:
    name: 發布 GitHub 來源版本
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ci-rollup]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 取得完整已驗證歷史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 驗證版本並產生當版說明
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          . .\script\release\release.ps1
          Assert-ReleaseOnMain -PackageRoot $PWD.Path -Revision $env:SOURCE_COMMIT
          $release = .\script\release\build_source_release.ps1 -Version $env:RELEASE_TAG -Revision $env:SOURCE_COMMIT -OutputDirectory "$env:RUNNER_TEMP\release-notes"
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: release
      - name: 發布前核對版本下載指引
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . .\script\release\release.ps1
          $notes = [IO.File]::ReadAllText("$env:RUNNER_TEMP\release-notes\release_notes.md", [Text.UTF8Encoding]::new($false, $true))
          Assert-ReleaseDownloadGuide -Version $env:RELEASE_TAG -Notes $notes
      - name: 準備固定的證據驗證工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 建立真正整體覆蓋率驗證器
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
        run: |
          go build -o $env:WINDOWS_SETUP_COVERAGE_TOOL ./script/test/repo_coverage_tool
      - name: 下載同一次執行的去識別品質證據
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 下載同一次執行的容器報告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 封裝並驗證當版完整報表
        shell: powershell
        run: |
          .\script\report\build_release_bundle.ps1
      - name: 草稿附齊品質證據後發布不可變版本
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
          WINDOWS_SETUP_REPORT_BUNDLE_TOOL: ${{ runner.temp }}/report_bundle_tool.exe
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $arguments = @{PublicDirectory=(Join-Path $env:RUNNER_TEMP ("windows-test-reports-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT));ContainerDirectory=(Join-Path $env:RUNNER_TEMP ("docker-test-reports-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT));ReportArchive=(Join-Path $env:RUNNER_TEMP ("windows_setup_report_"+$env:RELEASE_TAG+".zip"));RunAttempt=[int]$env:GITHUB_RUN_ATTEMPT;RunUrl=("https://github.com/"+$env:GITHUB_REPOSITORY+"/actions/runs/"+$env:GITHUB_RUN_ID);Version=$env:RELEASE_TAG;Commit=$env:SOURCE_COMMIT;NotesPath="$env:RUNNER_TEMP\release-notes\release_notes.md";Repository=$env:GH_REPO;Prerelease=($env:IS_PRERELEASE -eq 'true')}
          .\script\report\publish_quality_release.ps1 @arguments

  build-portal:
    name: 建立 main 與不可變版本品質索引
    if: always() && needs.ci-rollup.result == 'success' && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success'))
    needs: [coverage-aggregation, requirements-gate, docker-tests, release, ci-rollup]
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      superseded: ${{ steps.portal.outputs.superseded }}
    permissions:
      contents: read
      actions: read

    concurrency:
      group: pages-report
      cancel-in-progress: false
    steps:
      - name: 取得受保護 main 的報表產生器
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: 準備固定的證據驗證工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 建立真正整體覆蓋率驗證器
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
          WINDOWS_SETUP_REPORT_BUNDLE_TOOL: ${{ runner.temp }}/report_bundle_tool.exe
        run: |
          go build -o $env:WINDOWS_SETUP_COVERAGE_TOOL ./script/test/repo_coverage_tool
          go build -o $env:WINDOWS_SETUP_REPORT_BUNDLE_TOOL ./script/test/report_bundle_tool
      - name: 核對版本品質附件並本地產生索引
        id: portal
        shell: powershell
        env:
          WINDOWS_SETUP_COVERAGE_TOOL: ${{ runner.temp }}/repo_coverage_tool.exe
          WINDOWS_SETUP_REPORT_BUNDLE_TOOL: ${{ runner.temp }}/report_bundle_tool.exe
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          . .\script\test\ci_tasks.ps1
          $parameters = Get-CIPortalParameters -Repository $env:GH_REPO -OutputDirectory "$env:RUNNER_TEMP\portal-inputs" -EventRef $env:EVENT_REF -RunId $env:CURRENT_RUN -EventName $env:EVENT_NAME -RunAttempt ([int]$env:CURRENT_ATTEMPT)
          $inputs = .\script\report\get_portal_inputs.ps1 @parameters
          Invoke-CIPortalBuild -Inputs $inputs -OutputDirectory "$env:RUNNER_TEMP\quality-portal" -OutputPath $env:GITHUB_OUTPUT -SummaryPath $env:GITHUB_STEP_SUMMARY
      - name: 保存去識別 portal 供 Linux 部署
        if: steps.portal.outputs.superseded != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-portal/
          retention-days: 7
          if-no-files-found: error

  pages-freshness:
    name: 確認 main 尚未前進
    needs: [build-portal]
    if: always() && needs.build-portal.result == 'success' && needs.build-portal.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.fresh.outputs.current }}
    permissions:
      contents: read
    steps:
      - name: 取得本次來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 確認 main 尚未前進
        id: fresh
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
        run: |
          . ./script/test/ci_tasks.ps1
          Set-CIMainFreshness -Repository $env:GITHUB_REPOSITORY -Ref $env:GITHUB_REF -RunSha $env:RUN_SHA -OutputPath $env:GITHUB_OUTPUT
  publish-reports:
    name: 發布 Pages 品質入口
    needs: [build-portal, pages-freshness]
    if: always() && needs.build-portal.result == 'success' && needs.build-portal.outputs.superseded != 'true' && needs.pages-freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deployed: ${{ steps.fresh.outputs.current == 'true' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得本次來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: 下載已驗證的品質入口
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: portal
      - name: 封裝 Pages artifact
        shell: bash
        run: |
          tar --dereference --hard-dereference --directory portal -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: 上傳 Pages artifact
        id: pages_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: ${{ runner.temp }}/artifact.tar
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
      - name: 核對同次 Pages 工件可見性
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact-id }}
          PAGES_ARTIFACT_DIGEST: ${{ steps.pages_artifact.outputs.artifact-digest }}
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        with:
          script: |
            require('child_process').execFileSync('go', ['run', '-mod=vendor', './script/test/pages_artifact_visibility'], {stdio:'inherit'})
      - name: 確認 main 尚未前進再發布
        id: fresh
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
        run: |
          . ./script/test/ci_tasks.ps1
          Set-CIMainFreshness -Repository $env:GITHUB_REPOSITORY -Ref $env:GITHUB_REF -RunSha $env:RUN_SHA -OutputPath $env:GITHUB_OUTPUT
      - name: 發布 Pages
        if: steps.fresh.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  verify-deployment:
    name: 公開部署需求驗收
    needs: [publish-reports]
    if: always() && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && needs.publish-reports.result == 'success' && needs.publish-reports.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    steps:
      - name: 取得本次驗收程式與 README
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 取得同次已驗證入口產物
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-portal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-portal
      - name: 取得不可變最新版本
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPO/releases/latest" > "$RUNNER_TEMP/latest-release.json"
      - name: 匿名核對公開網站與本次來源
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LATEST_RELEASE_METADATA: ${{ github.event_name == 'workflow_dispatch' && format('{0}/latest-release.json', runner.temp) || '' }}
        run: |
          go run ./script/test/verify_deployment --base-url https://ycpss91255-lab.github.io/windows_setup/ --readme readme.md --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL" --portal-dir "$RUNNER_TEMP/verified-portal" --latest-release-metadata "$LATEST_RELEASE_METADATA"

      - name: 匿名核對公開版本與不可變證據
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-metadata.json"
          go build -o "$RUNNER_TEMP/report-bundle-tool" ./script/test/report_bundle_tool
          go run ./script/test/verify_deployment --mode release --require-runtime --base-url https://ycpss91255-lab.github.io/windows_setup/ --readme readme.md --expected-sha "$EXPECTED_SHA" --expected-run-url "$EXPECTED_RUN_URL" --tag "$RELEASE_TAG" --release-metadata "$RUNNER_TEMP/release-metadata.json" --report-bundle-tool "$RUNNER_TEMP/report-bundle-tool" --report-archive "$RUNNER_TEMP/tag-report-download/windows_setup_report_${RELEASE_TAG}.zip" --run-attempt "$GITHUB_RUN_ATTEMPT" --download-release-asset --release-repository "$RELEASE_REPO"
